[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "octane-pil"
version = "0.3.0"
description = "Evidence-driven project intelligence, function tracing, and validated repair workflows for OpenClaw and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
octane = "octane.__main__:main"

[project.optional-dependencies]
dev = ["ruff==0.17.6", "coverage==7.17.3", "radon==6.0.1"]
provenance = ["cryptography>=46,<51"]
testing = ["hypothesis>=6.140,<7"]
# tree-sitter-languages 1.10.2 calls the pre-0.22 Language/Parser API.
# Upgrade this tested pair together with the grammar-loader migration.
ast = ["tree-sitter-languages==1.10.2", "tree-sitter==0.21.3"]

[tool.setuptools.packages.find]
include = ["octane*"]

[tool.setuptools.package-data]
octane = ["*.cjs", "*.rb"]
"octane.ledger" = ["migrations/*.sql"]

[tool.ruff]
# The checkout-only scripts/octane.py ledger path supports 3.9; packaged/native tools require 3.11+.
target-version = "py39"
exclude = ["build", "node_modules"]

[tool.ruff.lint]
select = ["F", "B", "S102", "S306", "S307", "B904", "UP034"]
