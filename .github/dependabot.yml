version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # 0.13 ships offline grammars; 1.x downloads parsers at runtime.
    # Upgrade together with the parser/query API and offline-loader review.
    ignore:
      - dependency-name: "tree-sitter-language-pack"
        versions: [">=1.0.0"]
