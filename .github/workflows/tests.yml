name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Portable skill on Python 3.9
        if: matrix.python == '3.9'
        run: python -m unittest discover -s tests -p 'test_octance*.py' -v
      - name: Full standard-library suite
        if: matrix.python != '3.9'
        run: python -m unittest discover -s tests -v

  optional-parser:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install '.[ast]'
      - run: python -m unittest discover -s tests -v

  bridge-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm
      - run: npm ci --omit=peer
      - run: npm test
      - run: node --check openclaw/index.js

  docker-experiment:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OCTANE_TEST_DOCKER_IMAGE: python:3.12-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: docker pull "$OCTANE_TEST_DOCKER_IMAGE"
      - run: python -m unittest tests.test_native_workflow -v
