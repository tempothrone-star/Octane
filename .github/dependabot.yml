version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # The bundled grammar loader uses the pre-0.22 Python API. A newer runtime
    # requires a coordinated loader/grammar migration, not a standalone bump.
    ignore:
      - dependency-name: "tree-sitter"
        versions: [">=0.22.0"]
