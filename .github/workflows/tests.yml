name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # GitHub's Python 3.9 builds are available for Ubuntu 24.04.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Checkout CLI on Python 3.9
        if: matrix.python == '3.9'
        run: python -m unittest discover -s tests -p 'test_octane*.py' -v
      - name: Full standard-library suite
        if: matrix.python != '3.9'
        run: python -m unittest discover -s tests -v

  optional-parser:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install '.[ast]'
      - run: python -m unittest discover -s tests -v

  bridge-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
      - run: npm ci --omit=peer
      - run: npm test
      - run: node --check openclaw/index.js

  docker-experiment:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      COVERAGE_FILE: ${{ github.workspace }}/.coverage-docker
      COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
      OCTANE_TEST_DOCKER_IMAGE: python:3.12-slim
      OCTANE_TEST_PROPERTY_IMAGE: octane-validation:properties
      OCTANE_TEST_NODE_PROPERTY_IMAGE: octane-validation:node-properties
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: docker pull "$OCTANE_TEST_DOCKER_IMAGE"
      - run: docker build -t "$OCTANE_TEST_PROPERTY_IMAGE" -f tests/images/properties.Dockerfile .
      - run: docker build -t "$OCTANE_TEST_NODE_PROPERTY_IMAGE" -f tests/images/node-properties.Dockerfile .
      - run: python -m pip install '.[dev,ast,provenance]'
      - run: coverage run -m unittest discover -s tests -q
      - run: coverage combine
      - run: coverage report --include='octane/workspace.py' --fail-under=78
      - run: coverage report --include='octane/mutation.py' --fail-under=95

  quality:
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
      COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install '.[dev,provenance]'
      - run: ruff check octane tests scripts/check_complexity.py
      - run: python scripts/check_complexity.py
      - run: coverage run -m unittest discover -s tests -q
      - run: coverage combine
      - run: coverage report --fail-under=75
      - run: coverage report --include='octane/experiments.py' --fail-under=100
      - run: coverage report --include='octane/test_protection.py' --fail-under=100
      - run: coverage report --include='octane/storage.py' --fail-under=100
      - run: coverage report --include='octane/provenance.py' --fail-under=90
      - run: coverage report --include='octane/process.py' --fail-under=90

  semantic-and-provenance:
    runs-on: ubuntu-latest
    env:
      OCTANE_LSP_TEST_TOOLS: ${{ github.workspace }}/.lsp-tools
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - run: python -m pip install '.[provenance]'
      - run: npm install --prefix "$OCTANE_LSP_TEST_TOOLS" pyright@1.1.414 typescript-language-server@6.1.0 typescript@5.9.3
      - run: python -m unittest tests.test_language_server tests.test_integrations -v
