[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "octane-pil"
version = "1.0.0"
description = "Evidence-driven project intelligence, function tracing, and validated repair workflows for OpenClaw and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
octane = "octane.__main__:main"

[project.optional-dependencies]
dev = ["ruff==0.17.6", "coverage==7.17.3", "radon==6.0.1"]
provenance = ["cryptography>=46,<51"]
testing = ["hypothesis>=6.140,<7"]
# This release bundles grammars in wheels, including Python 3.13/3.14.
# 1.x fetches grammars at runtime; keep analysis offline until that loader is reviewed.
ast = ["tree-sitter-language-pack==0.13.0", "tree-sitter==0.25.2"]

[tool.setuptools.packages.find]
include = ["octane*"]

[tool.setuptools.package-data]
octane = ["*.cjs", "*.rb"]
"octane.ledger" = ["migrations/*.sql"]

[tool.ruff]
# The checkout-only scripts/octane.py ledger path supports 3.9; packaged/native tools require 3.11+.
target-version = "py39"
exclude = ["build", "node_modules"]

[tool.ruff.lint]
select = ["F", "B", "S102", "S306", "S307", "B904", "UP034"]
