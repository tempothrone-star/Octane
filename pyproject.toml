[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "octane-pil"
version = "0.1.0"
description = "Internal Python and SQLite engine for the Octane OpenClaw plugin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["octane*"]
